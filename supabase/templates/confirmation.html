<!doctype html>
<html lang="en">
  <body style="margin:0;padding:24px;background:#fbfaf7;font-family:Georgia,serif;color:#2a2622">
    <table role="presentation" width="100%" style="max-width:520px;margin:0 auto">
      <tr><td>
        <h1 style="font-size:26px;margin:0 0 16px">The Gallup Way</h1>
        <p style="font-family:Arial,sans-serif;font-size:16px;line-height:1.5">
          Welcome! Confirm your email address to finish creating your account on the community board.
        </p>
        <p style="margin:24px 0">
          <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email&next=/"
             style="background:#a8432a;color:#ffffff;padding:12px 20px;border-radius:6px;text-decoration:none;font-family:Arial,sans-serif;font-weight:bold">
            Confirm my email
          </a>
        </p>
        <p style="font-family:Arial,sans-serif;font-size:13px;color:#6b635b">
          If you didn't sign up, you can ignore this email.
        </p>
      </td></tr>
    </table>
  </body>
</html>
